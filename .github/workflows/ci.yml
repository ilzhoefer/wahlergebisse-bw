name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Read-only token: nothing in CI writes to the repository.
permissions:
  contents: read

# Actions are pinned to commit hashes (version in the comment); Dependabot keeps them current.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # src/lib/paraglide is gitignored and normally generated by the Vite plugin; check, lint and
      # the tests all import it.
      - run: bunx paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
      - run: bun run check
      - run: bun run lint
      # Offline tests only — scripts/check-html5-opendata.ts hits the live komm.one API.
      - run: bun run test

  # Builds the production app, starts it on an empty migrated database and runs scripts/smoke.ts:
  # catches what type-checking can't (a build that fails, a dependency that 500s every request).
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # drizzle-kit's CLI fails under Bun (node:sqlite), see README; it runs on Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: node node_modules/drizzle-kit/bin.cjs migrate
      - run: bun run db:seed
      - run: bun run build
      - name: Start the production build
        run: |
          bun build/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/healthz && exit 0; sleep 1; done
          cat server.log; exit 1
        env:
          NODE_ENV: production
          ORIGIN: http://localhost:3000
          ADMIN_PASSWORD: ci-only-password-1234
          SESSION_SECRET: ci-only-session-secret-0123456789abcdef
          OPERATOR_NAME: CI
          OPERATOR_ADDRESS: Musterstraße 1, 12345 Musterstadt
          OPERATOR_EMAIL: ci@example.org
      - run: bun run scripts/smoke.ts http://localhost:3000
      - if: failure()
        run: cat server.log
