# Weekly update PRs for the Bun packages and the pinned GitHub Actions. Minor and patch updates are
# grouped into one PR per ecosystem; majors come one by one, since they may need code changes.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
